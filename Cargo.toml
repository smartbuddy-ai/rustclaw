[package]
name = "rustclaw"
version = "0.1.0"
edition = "2024"
description = "Lightweight AI agent runtime — experimental subset of OpenClaw, built in Rust"
license = "MIT"
repository = "https://github.com/smartbuddy-ai/rustclaw"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2.5"
base64 = "0.22"
tokio-cron-scheduler = "0.13"
cron = "0.15"
directories = "6"
libc = "0.2"
dotenvy = "0.15"
dialoguer = "0.11"
ratatui = "0.29"
crossterm = "0.28"
aes-gcm = "0.10"
zeroize = "1"
hmac = "0.12"
sha2 = "0.10"
glob = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
scraper = "0.24"
tokio-util = "0.7"
urlencoding = "2.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
